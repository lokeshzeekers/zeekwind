# OPTIONAL: keep the OLD address working by redirecting it to the new one.
# Use this instead of your current zeekwind.zeekerstech.com site file (keep the certificate lines certbot already added).
server {
    listen 80;
    listen [::]:80;
    server_name zeekwind.zeekerstech.com;
    return 301 https://zeekpower.zeekerstech.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zeekwind.zeekerstech.com;
    ssl_certificate     /etc/letsencrypt/live/zeekwind.zeekerstech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zeekwind.zeekerstech.com/privkey.pem;
    return 301 https://zeekpower.zeekerstech.com$request_uri;
}
