# Zeek Power: nginx site for zeekpower.zeekerstech.com
# Install:  sudo cp nginx/zeekpower.zeekerstech.com.conf /etc/nginx/sites-available/zeekpower.zeekerstech.com
#           sudo ln -s /etc/nginx/sites-available/zeekpower.zeekerstech.com /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d zeekpower.zeekerstech.com      (adds the HTTPS block and the http->https redirect for you)

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name zeekpower.zeekerstech.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # live data uses a WebSocket on /ws: these three lines are required for it
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
